[project]
name = "nael-algorithms"
version = "0.1.0"
description = "A hands-on learning + practice lab for Python, algorithms, and testing"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["exercises"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
omit = ["*/test_*.py", "templates/*"]
